appId: host.exp.Exponent
---
# Run after create_activity_flow.yaml (creates "Maestro Host").
# This flow creates/uses a second real account ("Maestro Joiner") and swaps
# between the two via the Profile tab's Dev User Switcher.
- openLink: "exp://localhost:8081"
- runFlow:
    file: helpers/sign_in_as.yaml
    env:
      PHONE: "9876543211"
      NAME: "Maestro Joiner"
- tapOn: "Feed"
- extendedWaitUntil:
    visible:
      id: "discovery-feed"
    timeout: 25000
- tapOn:
    text: "Squad Weekend Turf Soccer 5v5"
- assertVisible: "Request to Join Squad"
- tapOn:
    id: "request-to-join"
- extendedWaitUntil:
    visible: "Join Request Pending"
    timeout: 15000

# Switch to the host account and accept the real request.
- tapOn: "Profile"
- tapOn:
    text: "Switch"
    optional: true
- tapOn:
    text: ".*Switch to Maestro Host.*"
- tapOn: "Feed"
- tapOn:
    text: "Squad Weekend Turf Soccer 5v5"
- tapOn:
    id: "review-requests"
- extendedWaitUntil:
    visible: ".*Maestro Joiner.*"
    timeout: 15000
- tapOn:
    text: ".*Accept.*"

# Switch back to the joiner and verify room persistence.
- tapOn: "Profile"
- tapOn:
    text: "Switch"
    optional: true
- tapOn:
    text: ".*Switch to Maestro Joiner.*"
- tapOn: "Feed"
- tapOn:
    text: "Squad Weekend Turf Soccer 5v5"
- extendedWaitUntil:
    visible: "You are Accepted!"
    timeout: 15000
- tapOn:
    text: "Enter Room"
- assertVisible:
    id: "room-messages"
- tapOn:
    id: "Room Message Input"
- inputText: "Maestro persisted message"
- tapOn:
    id: "Send Room Message"
- extendedWaitUntil:
    visible: "Maestro persisted message"
    timeout: 10000
