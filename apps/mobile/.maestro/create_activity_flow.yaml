appId: host.exp.Exponent
---
# Real host flow: authenticate, create a squad, and verify the discovery map.
- openLink: "exp://localhost:8081"
- tapOn:
    text: ".*(Get Started|Continue to Squads|Explore Hobbie).*"
    optional: true
- tapOn:
    text: ".*Alex \\(host\\).*"
    optional: true
- extendedWaitUntil:
    visible:
      id: "host-squad-button"
    timeout: 25000
- tapOn:
    id: "host-squad-button"
- assertVisible: "Host Live Squad"
- tapOn:
    id: "Squad Title Input"
- inputText: "Weekend Turf Soccer 5v5"
- tapOn:
    id: "Details Input"
- inputText: "Casual game at EcoWorld pitch."
- hideKeyboard
- tapOn: "3h"
- tapOn:
    id: "broadcast-live-squad"
- extendedWaitUntil:
    visible:
      id: "discovery-map"
    timeout: 20000
- assertVisible:
    id: "discovery-map"
