appId: host.exp.Exponent
---
# Real host flow: sign in as a real account, create a squad, and verify discovery.
# Creates the "Maestro Host" account (phone 9876543210) on first run.
- openLink: "exp://localhost:8081"
- runFlow:
    file: helpers/sign_in_as.yaml
    env:
      PHONE: "9876543210"
      NAME: "Maestro Host"
- extendedWaitUntil:
    visible:
      id: "host-squad-button"
    timeout: 25000
- tapOn:
    id: "host-squad-button"
- assertVisible: "Host Live Squad"
- tapOn:
    id: "Squad Title Input"
- inputText: "Weekend Turf Soccer 5v5"
- tapOn:
    id: "Details Input"
- inputText: "Casual game at EcoWorld pitch."
- hideKeyboard
- tapOn: "3h"
- tapOn:
    id: "broadcast-live-squad"
- extendedWaitUntil:
    visible:
      id: "discovery-map"
    timeout: 20000
- assertVisible:
    id: "discovery-map"
