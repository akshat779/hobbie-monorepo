appId: host.exp.Exponent
---
# Test 1: Full Onboarding Flow
# Phone -> Dev OTP -> Photos -> Name -> B-day -> Gender -> Interests -> Radar
- openLink: "exp://localhost:8081"
# If on create modal, close it
- tapOn:
    text: "Cancel"
    optional: true

# If on Squad Details, go back
- tapOn:
    text: "Back to Feed"
    optional: true

- tapOn:
    text: ".*(Get Started|Continue to Squads).*"
    optional: true
- extendedWaitUntil:
    visible: ".*(Enter your mobile number|Enter 6-digit code|Add your recent pics|Hobbie|Feed).*"
    timeout: 25000

# Handle Phone screen if visible
- runFlow:
    when:
      visible: ".*Enter your mobile number.*"
    commands:
      - tapOn: ".*98765 43210.*"
      - inputText: "9876543210"
      - tapOn: "Send Verification Code"

# Handle OTP screen if visible
- runFlow:
    when:
      visible: ".*Enter 6-digit code.*"
    commands:
      - tapOn: ".*Dev Fast Bypass.*"

# Photos step. Requires at least one photo; selecting from the native picker
# cannot be fully automated, so the taps below are best-effort.
- runFlow:
    when:
      visible: "Add your recent pics"
    commands:
      - tapOn: "Add photo 1"
      - tapOn:
          text: ".*(Recents|All Photos|Photos).*"
          optional: true
      - tapOn:
          index: 0
          optional: true
      - tapOn:
          text: ".*(Add|Done|Choose).*"
          optional: true
      - tapOn:
          text: "Next"
          optional: true

# Name step
- runFlow:
    when:
      visible: ".*first name.*"
    commands:
      - tapOn: "Enter first name"
      - inputText: "Maestro Tester"
      - tapOn: "Next"

# Birthday step
- runFlow:
    when:
      visible: ".*b-day.*"
    commands:
      - tapOn: ".*DD / MM / YYYY.*"
      - tapOn:
          text: "Done"
          optional: true
      - tapOn: "Next"

# Gender step
- runFlow:
    when:
      visible: ".*your gender.*"
    commands:
      - tapOn: "Male"
      - tapOn: "Next"

# Interests step (final)
- runFlow:
    when:
      visible: ".*What are you into.*"
    commands:
      - tapOn: ".*Hobby Football.*"
      - tapOn: "Enter Hobbie"

# Assert we are on the main discovery radar or tabs
- extendedWaitUntil:
    visible: ".*(Hobbie|Feed).*"
    timeout: 20000
- assertVisible: ".*(Hobbie|Feed).*"
