<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .scan-line {
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 4px rgba(225, 182, 255, 0.2)); }
            100% { filter: drop-shadow(0 0 12px rgba(225, 182, 255, 0.8)); }
        }

        .progress-ring {
            stroke-dasharray: 800;
            stroke-dashoffset: 400; /* Partially filled */
            animation: progress 4s ease-out forwards;
        }

        @keyframes progress {
            0% { stroke-dashoffset: 800; }
            100% { stroke-dashoffset: 400; }
        }
    </style>
</head>
<body class="bg-black text-text-moonlight overflow-hidden antialiased min-h-screen flex items-center justify-center">
<!-- Container for full screen camera view -->
<div class="relative w-[390px] h-[844px] flex flex-col items-center justify-center bg-void overflow-hidden">
<!-- Camera Background Simulation -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A POV shot from a smartphone front-facing camera at night, showing a dimly lit urban environment in the background with subtle neon streetlights in shades of deep violet and blue. The scene is slightly out of focus to simulate a depth-of-field effect behind a user's face, maintaining the 'Nocturnal Pulse' dark urban aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCgv0CpV-ePMxhp_Hf4qm11F9k5NadeFAcZMC7Zc_PNok-TtE2pSJNv0UHu0UUp4An1jKdZ6Sc84XE3ygqvOiY4M61JP03KDFjnQ0N1-nzxIvSeaLSZ5PX0T9G1EWL6uXBXGQKXstd7neBFY8qG6_-4rYF8jHXbEOOpjvScuTZNqhiZdYyiOxJGueoSjjoF6zdui1_RXMm6v4tYnhB4kkISsC3hdyo__h9E81-VM1290IVaTza2k_kFRA')">
</div>
<!-- Vignette / Dimmed Edges Overlay -->
<div class="absolute inset-0 z-10" style="background: radial-gradient(circle at center, transparent 20%, rgba(13, 11, 20, 0.95) 70%);">
</div>
<!-- Scanning Overlay Effect -->
<div class="absolute inset-0 z-20 pointer-events-none overflow-hidden mix-blend-screen opacity-30">
<div class="w-full h-1 bg-signal-violet shadow-[0_0_8px_rgba(210,187,255,0.8)] scan-line absolute top-1/2"></div>
<div class="w-full h-full bg-[linear-gradient(rgba(210,187,255,0.03)_1px,transparent_1px)] bg-[size:100%_4px]"></div>
</div>
<!-- Top Actions -->
<div class="absolute top-0 left-0 w-full z-50 p-lg flex justify-between items-center mt-[44px]">
<!-- Blank space for balance or future back button if needed, but per prompt only Close is needed -->
<div></div>
<button aria-label="Close Verification" class="w-10 h-10 rounded-full border border-border-hairline bg-ink/50 backdrop-blur-md flex items-center justify-center text-text-moonlight hover:border-signal-violet transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Main Content Area -->
<div class="relative z-30 flex flex-col items-center w-full max-w-sm px-xl">
<!-- Instruction Text -->
<div class="mb-3xl text-center">
<h1 class="font-display-xl-mobile text-display-xl-mobile tracking-tighter text-text-moonlight drop-shadow-md">
                    Look straight and blink slowly
                </h1>
<p class="font-mono-data text-mono-data text-pulse-lilac mt-sm uppercase tracking-widest opacity-80">
                    Scanning biometric data
                </p>
</div>
<!-- Viewfinder Guide -->
<div class="relative w-64 h-80 flex items-center justify-center">
<svg class="absolute inset-0 overflow-visible" height="100%" viewbox="0 0 256 320" width="100%">
<!-- Base Guide (Dashed Oval) -->
<ellipse class="text-pulse-lilac/30" cx="128" cy="160" fill="none" rx="120" ry="156" stroke="currentColor" stroke-dasharray="8 8" stroke-width="2"></ellipse>
<!-- Progress Ring -->
<ellipse class="text-signal-violet progress-ring pulse-glow" cx="128" cy="160" fill="none" rx="120" ry="156" stroke="currentColor" stroke-linecap="round" stroke-width="4" style="transform-origin: center; transform: rotate(-90deg);"></ellipse>
</svg>
<!-- Center Target Reticle (Subtle) -->
<div class="w-1 h-1 rounded-full bg-pulse-lilac opacity-50 pulse-glow"></div>
</div>
</div>
<!-- Bottom Status/Data -->
<div class="absolute bottom-[34px] w-full z-30 flex justify-center">
<div class="bg-ink-raised border border-border-hairline rounded-full px-lg py-sm flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-pulse-lilac animate-pulse"></span>
<span class="font-mono-data text-mono-data text-text-dusk">SYS_LINK_ACTIVE</span>
</div>
</div>
</div>
