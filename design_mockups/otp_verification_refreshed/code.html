<style>
        body {
            background-color: #0D0B14; /* bg-void */
            color: #F5F0FF; /* text-moonlight */
        }
        
        /* Custom Input Styling for OTP */
        .otp-input {
            width: 48px;
            height: 56px;
            text-align: center;
            background-color: #17131F; /* bg-ink */
            border: 1px solid #2C2739; /* border-hairline */
            border-radius: 12px;
            color: #F5F0FF;
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            transition: all 0.2s ease;
        }
        
        .otp-input:focus {
            outline: none;
            border-color: #d2bbff; /* primary / Signal Violet */
            box-shadow: 0 0 0 1px #d2bbff;
            background-color: #211C2E; /* bg-ink-raised */
        }
        
        /* Pulse Animation for Timer */
        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow {
            animation: pulse-opacity 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      width: 390px;
      height: 844px;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
    }
  </style>
</head>
<body class="flex flex-col font-body-lg antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Transactional, minimal shell) -->
<header class="absolute top-0 w-full z-50 bg-bg-void/80 backdrop-blur-md border-b border-border-hairline h-16 flex items-center justify-between px-lg md:px-xl">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-display-m text-display-m text-text-moonlight">
            Nocturnal Pulse
        </div>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-lg pt-16 pb-xl h-full w-full">
<div class="w-full mx-auto flex flex-col gap-2xl">
<!-- Header Section -->
<div class="text-center space-y-md">
<h1 class="font-display-xl-mobile text-display-xl-mobile md:font-display-xl md:text-display-xl text-text-moonlight tracking-tight">
                    Verify your number
                </h1>
<p class="font-body-lg text-body-lg text-text-dusk">
                    Enter the 6-digit code sent to<br/>
<span class="text-text-moonlight font-medium">+1 (555) 019-8372</span>
</p>
</div>
<!-- OTP Input Section -->
<form class="flex flex-col gap-xl w-full" id="otp-form">
<div class="flex justify-between w-full max-w-[342px] mx-auto gap-xs sm:gap-sm">
<input aria-label="Digit 1" autofocus="" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 5" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 6" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center gap-md mt-sm">
<div class="flex items-center gap-xs text-primary font-mono-data text-mono-data bg-primary-container/10 px-md py-xs rounded-full border border-primary/20">
<span class="material-symbols-outlined text-[16px] animate-pulse-slow">timer</span>
<span id="countdown">00:59</span>
</div>
<button class="mt-md font-body-sm text-body-sm text-text-moonlight hover:text-primary transition-colors underline decoration-border-hairline underline-offset-4 hover:decoration-primary" type="button">
                        Resend code
                    </button>
</div>
<!-- Primary Action (Initially disabled/dimmed until filled) -->
<button class="mt-lg w-full bg-surface-variant text-text-dusk py-lg rounded-full font-body-lg text-body-lg font-medium transition-all duration-300 pointer-events-none" id="verify-btn" type="submit">
                    Verify Pulse
                </button>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verify-btn');
            
            // Auto-focus logic for OTP inputs
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Only allow numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    // Move to next input if value is entered
                    if (e.target.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    checkCompletion();
                });

                input.addEventListener('keydown', (e) => {
                    // Move to previous input on backspace if current is empty
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = ''; // Clear previous input on backspace to it
                    }
                });
                
                // Allow pasting full code
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    
                    if (pastedData.length > 0) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (i < inputs.length) {
                                inputs[i].value = pastedData[i];
                            }
                        }
                        // Focus the next empty input or the last one
                        const focusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                        checkCompletion();
                    }
                });
            });
            
            function checkCompletion() {
                const allFilled = Array.from(inputs).every(input => input.value.length === 1);
                if (allFilled) {
                    verifyBtn.classList.remove('bg-surface-variant', 'text-text-dusk', 'pointer-events-none');
                    verifyBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_0_15px_rgba(210,187,255,0.3)]', 'active:scale-95');
                } else {
                    verifyBtn.classList.add('bg-surface-variant', 'text-text-dusk', 'pointer-events-none');
                    verifyBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_0_15px_rgba(210,187,255,0.3)]', 'active:scale-95');
                }
            }

            // Simple timer countdown
            let timeLeft = 59;
            const timerDisplay = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timer);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.parentElement.classList.replace('text-primary', 'text-error');
                    timerDisplay.parentElement.classList.replace('border-primary/20', 'border-error/20');
                    timerDisplay.parentElement.classList.replace('bg-primary-container/10', 'bg-error-container/10');
                } else {
                    const seconds = timeLeft.toString().padStart(2, '0');
                    timerDisplay.textContent = `00:${seconds}`;
                }
            }, 1000);
        });
    </script>
</body></html>
