<style>
        .chip-selected {
            border-color: #FF6B5E !important;
            background-color: rgba(255, 107, 94, 0.1) !important;
            color: #FF6B5E !important;
        }
    </style>

<body class="bg-bg-void text-text-moonlight w-[390px] h-[844px] mx-auto relative overflow-hidden flex flex-col font-body-lg antialiased">
<!-- Top App Bar -->
<header class="absolute top-0 w-full z-50 flex justify-between items-center px-lg h-16 border-b border-hairline bg-surface dark:bg-surface transition-colors duration-200">
<button class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-signal-violet">Report Issue</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-[80px] pb-[100px] px-lg overflow-y-auto">
<p class="text-text-dusk font-body-sm mb-xl">
            Your report is confidential. Please select the primary reason for reporting this user to help our safety team take action.
        </p>
<!-- Reason Grid -->
<div class="mb-2xl">
<h2 class="font-mono-data text-mono-data text-text-dusk uppercase mb-md">Select Reason</h2>
<div class="grid grid-cols-2 gap-md" id="reason-grid">
<button class="reason-chip flex flex-col items-center justify-center p-lg rounded-xl border border-border-hairline bg-bg-ink hover:border-outline-variant transition-colors text-center min-h-[100px]" type="button">
<span class="material-symbols-outlined text-[32px] mb-sm text-text-dusk group-hover:text-text-moonlight transition-colors">warning</span>
<span class="font-label-md text-label-md">Inappropriate behavior</span>
</button>
<button class="reason-chip flex flex-col items-center justify-center p-lg rounded-xl border border-border-hairline bg-bg-ink hover:border-outline-variant transition-colors text-center min-h-[100px]" type="button">
<span class="material-symbols-outlined text-[32px] mb-sm text-text-dusk group-hover:text-text-moonlight transition-colors">person_off</span>
<span class="font-label-md text-label-md">Didn't show up</span>
</button>
<button class="reason-chip flex flex-col items-center justify-center p-lg rounded-xl border border-border-hairline bg-bg-ink hover:border-outline-variant transition-colors text-center min-h-[100px]" type="button">
<span class="material-symbols-outlined text-[32px] mb-sm text-text-dusk group-hover:text-text-moonlight transition-colors">masks</span>
<span class="font-label-md text-label-md">False identity</span>
</button>
<button class="reason-chip flex flex-col items-center justify-center p-lg rounded-xl border border-border-hairline bg-bg-ink hover:border-outline-variant transition-colors text-center min-h-[100px]" type="button">
<span class="material-symbols-outlined text-[32px] mb-sm text-text-dusk group-hover:text-text-moonlight transition-colors">gavel</span>
<span class="font-label-md text-label-md">Safety concern</span>
</button>
</div>
</div>
<!-- Details Input -->
<div class="mb-xl">
<label class="font-mono-data text-mono-data text-text-dusk uppercase mb-md block flex justify-between" for="details">
<span>Additional Details</span>
<span class="text-on-surface-variant text-[10px]">Optional</span>
</label>
<textarea class="w-full bg-bg-ink border border-border-hairline rounded-lg p-lg text-text-moonlight placeholder:text-on-surface-variant focus:border-signal-violet focus:ring-0 transition-colors font-body-sm" id="details" placeholder="Please provide any additional context..." rows="4"></textarea>
</div>
</main>
<!-- Bottom Action -->
<div class="absolute bottom-0 w-full p-lg bg-bg-void/90 backdrop-blur-md border-t border-border-hairline z-40 pb-xl">
<button class="w-full py-lg rounded-full border-2 border-coral bg-transparent text-text-moonlight font-headline-md text-headline-md flex items-center justify-center gap-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined">flag</span>
            Submit Report
        </button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.reason-chip');
            
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    // Deselect all
                    chips.forEach(c => {
                        c.classList.remove('chip-selected');
                        const icon = c.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-coral');
                        icon.classList.add('text-text-dusk');
                    });
                    
                    // Select clicked
                    chip.classList.add('chip-selected');
                    const activeIcon = chip.querySelector('.material-symbols-outlined');
                    activeIcon.classList.remove('text-text-dusk');
                    activeIcon.classList.add('text-coral');
                });
            });
        });
    </script>
</body></html>
