<!-- Bottom Nav Bar (Suppressed on Feedback/Transactional screen per shell logic) -->
<script>
        // Simple toggle state management for visual feedback on buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                // If it's a thumb button
                if(this.querySelector('.material-symbols-outlined')) {
                    const sibling = this.nextElementSibling || this.previousElementSibling;
                    
                    // Reset both
                    this.classList.remove('bg-bg-ink-raised', 'border-signal-violet', 'border-ember', 'text-signal-violet', 'text-ember');
                    this.classList.add('border-hairline', 'text-text-dusk');
                    if(sibling) {
                        sibling.classList.remove('bg-bg-ink-raised', 'border-signal-violet', 'border-ember', 'text-signal-violet', 'text-ember');
                        sibling.classList.add('border-hairline', 'text-text-dusk');
                    }

                    // Apply active state
                    const icon = this.querySelector('.material-symbols-outlined').textContent;
                    this.classList.remove('border-hairline', 'text-text-dusk');
                    this.classList.add('bg-bg-ink-raised');
                    
                    if(icon === 'thumb_up') {
                        this.classList.add('border-signal-violet', 'text-signal-violet');
                    } else {
                        this.classList.add('border-ember', 'text-ember');
                    }
                }
            });
        });
    </script>
