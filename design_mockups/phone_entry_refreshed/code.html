<style>
        body {
            background-color: #0D0B14; /* bg-void */
            color: #F5F0FF; /* text-moonlight */

        /* Focus ring removal for styling */
        input:focus, select:focus, button:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
<style>
    body {
      width: 390px;
      height: 844px;

<body class="bg-bg-void text-text-moonlight flex flex-col items-center justify-between font-body-lg antialiased">
<!-- TopAppBar (Suppressed per rules: transactional linear flow) -->
<nav class="w-full flex items-center justify-start p-lg pt-xl md:pt-3xl mx-auto">
<button aria-label="Go back" class="flex items-center justify-center p-sm text-text-dusk hover:text-text-moonlight transition-colors rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</nav>
<!-- Main Content Canvas -->
<main class="w-full flex-1 flex flex-col items-center justify-start px-lg mt-2xl mx-auto">
<!-- Header -->
<div class="w-full text-left mb-2xl">
<h1 class="font-display-xl-mobile text-display-xl-mobile md:font-display-xl md:text-display-xl text-text-moonlight mb-md tracking-tight">Enter your phone</h1>
<p class="font-body-sm text-body-sm text-text-dusk max-w-[280px]">
                We'll text you a verification code. Message and data rates may apply.
            </p>
</div>
<!-- Input Area -->
<div class="w-full relative flex items-center rounded-full border border-border-hairline bg-bg-ink transition-colors focus-within:border-primary-container h-16 px-md">
<!-- Country Code Selector (Simulated Dropdown) -->
<button class="flex items-center gap-xs pr-sm border-r border-border-hairline text-text-moonlight font-mono-data text-mono-data h-full group">
<span class="opacity-90 group-hover:opacity-100 transition-opacity">+1</span>
<span class="material-symbols-outlined text-[20px] text-text-dusk group-hover:text-text-moonlight transition-colors">arrow_drop_down</span>
</button>
<!-- Phone Number Input -->
<input autocomplete="tel" autofocus="" class="flex-1 bg-transparent border-none text-text-moonlight font-mono-data text-mono-data h-full px-md placeholder:text-text-dusk/50 focus:ring-0" placeholder="(555) 000-0000" type="tel"/>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full pb-xl px-lg pt-lg mx-auto">
<!-- Primary Action Button -->
<button class="w-full bg-primary-container text-text-moonlight font-headline-md text-headline-md py-md rounded-full active:scale-[0.98] transition-transform duration-150 flex items-center justify-center">
            Send code
        </button>
</footer>
<!-- BottomNavBar (Suppressed per rules: transactional linear flow) -->
