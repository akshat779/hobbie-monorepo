<body class="bg-bg-void text-text-moonlight font-body-lg flex flex-col pt-16 pb-24 w-[390px] h-[844px] mx-auto overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary font-headline-md text-headline-md absolute top-0 w-full z-50 border-b border-border-hairline shadow-none transition-transform duration-150 flex items-center justify-between px-lg h-16">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity flex items-center justify-center p-sm">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-display-xl-mobile text-display-xl-mobile text-primary tracking-tighter">Create Activity</span>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity flex items-center justify-center p-sm invisible">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-lg py-xl space-y-xl w-full overflow-y-auto">
<!-- Activity Title Input -->
<section class="space-y-sm">
<input class="w-full bg-transparent border-none text-headline-lg font-headline-lg text-text-moonlight placeholder:text-text-dusk focus:ring-0 p-0" placeholder="Activity Title" type="text"/>
<div class="h-px w-full bg-border-hairline"></div>
</section>
<!-- Interest Picker -->
<section class="space-y-md">
<h2 class="font-body-sm text-body-sm text-text-dusk uppercase tracking-widest">Category</h2>
<div class="flex flex-wrap gap-sm">
<button class="px-lg py-sm rounded-full border border-signal-violet bg-signal-violet text-bg-void font-label-md text-label-md transition-colors">Sports</button>
<button class="px-lg py-sm rounded-full border border-border-hairline text-text-moonlight hover:border-signal-violet font-label-md text-label-md transition-colors">Gaming</button>
<button class="px-lg py-sm rounded-full border border-border-hairline text-text-moonlight hover:border-signal-violet font-label-md text-label-md transition-colors">Music</button>
<button class="px-lg py-sm rounded-full border border-border-hairline text-text-moonlight hover:border-signal-violet font-label-md text-label-md transition-colors">Food</button>
<button class="px-lg py-sm rounded-full border border-border-hairline text-text-moonlight hover:border-signal-violet font-label-md text-label-md transition-colors">Party</button>
<button class="px-lg py-sm rounded-full border border-border-hairline text-text-moonlight hover:border-signal-violet font-label-md text-label-md transition-colors">Study</button>
</div>
</section>
<!-- Physical/Virtual Toggle -->
<section class="bg-bg-ink rounded-full p-xs flex border border-border-hairline">
<button class="flex-1 py-sm rounded-full bg-surface-container-high text-signal-violet font-label-md text-label-md transition-colors shadow-sm">Physical</button>
<button class="flex-1 py-sm rounded-full text-text-dusk hover:text-text-moonlight font-label-md text-label-md transition-colors">Virtual</button>
</section>
<!-- Map Preview (Physical) -->
<section class="rounded-xl overflow-hidden border border-border-hairline bg-bg-ink relative h-48 map-container group cursor-pointer" data-alt="A stylized dark mode city map at night with vibrant neon violet roads and subtle blue glowing highlights, minimalist and abstract, top-down view, futuristic urban atmosphere.">
<div class="absolute inset-0 bg-bg-void/40 group-hover:bg-bg-void/20 transition-colors flex items-center justify-center flex-col">
<span class="material-symbols-outlined text-signal-violet text-3xl mb-xs icon-fill" data-icon="location_on">location_on</span>
<span class="font-body-sm text-body-sm text-text-moonlight bg-bg-ink-raised px-md py-xs rounded-full border border-border-hairline">Set Location</span>
</div>
</section>
<!-- Date & Time Range -->
<section class="grid grid-cols-2 gap-md">
<div class="bg-bg-ink border border-border-hairline rounded-xl p-md flex flex-col space-y-xs cursor-pointer hover:border-signal-violet transition-colors">
<span class="font-body-sm text-body-sm text-text-dusk flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="calendar_today">calendar_today</span> Start
                </span>
<span class="font-mono-data text-mono-data text-text-moonlight">Today, 21:00</span>
</div>
<div class="bg-bg-ink border border-border-hairline rounded-xl p-md flex flex-col space-y-xs cursor-pointer hover:border-signal-violet transition-colors">
<span class="font-body-sm text-body-sm text-text-dusk flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="schedule">schedule</span> End
                </span>
<span class="font-mono-data text-mono-data text-text-moonlight">Tomorrow, 02:00</span>
</div>
</section>

<div class="space-y-md">
<div class="flex justify-between items-center">
<h2 class="font-body-sm text-body-sm text-text-dusk uppercase tracking-widest">Age Range</h2>
<span class="font-mono-data text-mono-data text-signal-violet">18 - 35</span>
</div>
<!-- Custom Slider Track -->
<div class="relative h-1 bg-border-hairline rounded-full w-full">
<div class="absolute left-[10%] right-[30%] h-full bg-signal-violet rounded-full"></div>
<div class="absolute left-[10%] top-1/2 -translate-y-1/2 w-4 h-4 bg-signal-violet rounded-full border-2 border-bg-ink cursor-pointer hover:scale-110 transition-transform shadow-[0_0_8px_rgba(210,187,255,0.4)]"></div>
<div class="absolute right-[30%] top-1/2 -translate-y-1/2 w-4 h-4 bg-signal-violet rounded-full border-2 border-bg-ink cursor-pointer hover:scale-110 transition-transform shadow-[0_0_8px_rgba(210,187,255,0.4)]"></div>
</div>
</div>
<div class="space-y-md pt-sm">
<h2 class="font-body-sm text-body-sm text-text-dusk uppercase tracking-widest">Gender</h2>
<div class="flex gap-sm">
<button class="flex-1 py-sm rounded-full border border-signal-violet bg-signal-violet/10 text-signal-violet font-label-md text-label-md transition-colors">All</button>
<button class="flex-1 py-sm rounded-full border border-border-hairline text-text-dusk hover:text-text-moonlight font-label-md text-label-md transition-colors">Men</button>
<button class="flex-1 py-sm rounded-full border border-border-hairline text-text-dusk hover:text-text-moonlight font-label-md text-label-md transition-colors">Women</button>
</div>
</div>
</section>

<section class="space-y-xs">
<textarea class="w-full bg-bg-ink border border-border-hairline rounded-xl p-md text-body-lg font-body-lg text-text-moonlight placeholder:text-text-dusk focus:border-signal-violet focus:ring-0 min-h-[120px] resize-none transition-colors" placeholder="What's happening? Add details..."></textarea>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-lg bg-bg-void/80 backdrop-blur-md border-t border-border-hairline z-40">
<button class="w-full mx-auto block py-md rounded-full bg-signal-violet text-bg-void font-headline-md text-headline-md shadow-[0_4px_24px_-4px_rgba(210,187,255,0.3)] active:scale-[0.98] transition-all hover:bg-pulse-lilac">
