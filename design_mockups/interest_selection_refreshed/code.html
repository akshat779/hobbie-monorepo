<style>
        body {
            background-color: theme('colors.bg-void');
            color: theme('colors.text-moonlight');
        }
        
        .chip-unselected {
            border-color: theme('colors.border-hairline');
            background-color: transparent;
            color: theme('colors.text-dusk');
        }

        .chip-selected {
            border-color: theme('colors.primary-container');
            background-color: theme('colors.primary-container');
            color: theme('colors.text-moonlight');
        }
    </style>
<style>
    body {
      width: 390px;
      height: 844px;
      margin: 0 auto;
      position: relative;
    }

<body class="w-[390px] h-[844px] mx-auto relative overflow-hidden flex flex-col font-body-lg text-body-lg">
<!-- Top Navigation (Suppressed per logic, as this is an onboarding step, but requested for aesthetic balance, we'll keep it minimal if needed, otherwise omit based on "Linear/Transactional" rule) -->
<!-- According to rule: Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding, Checkout, or "Success/Confirmation" splash screens. -->
<main class="flex-grow flex flex-col justify-start px-lg pt-3xl pb-[120px] max-w-2xl mx-auto w-full relative z-10 overflow-y-auto">
<header class="mb-2xl space-y-sm">
<h1 class="font-display-xl-mobile text-display-xl-mobile md:font-display-xl md:text-display-xl text-text-moonlight tracking-tight">What's the vibe?</h1>
<p class="font-body-lg text-body-lg text-text-dusk">Select at least 3 interests to see what's happening nearby.</p>
</header>
<section class="flex flex-wrap gap-md" id="chip-container">
<!-- Chips rendered dynamically via JS or hardcoded -->
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Sports
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Gaming
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Food &amp; Cafe
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Study/Coworking
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Outdoors
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Nightlife
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Fitness
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Music
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Art
            </button>
<button class="interest-chip border chip-unselected rounded-full px-xl py-md font-body-sm text-body-sm transition-all duration-200 active:scale-95 flex items-center gap-xs">
                Volunteering
            </button>
</section>
</main>
<!-- Fixed Action Bar -->
<div class="absolute bottom-0 left-0 w-full bg-bg-void/90 backdrop-blur-md pt-lg pb-xl px-lg border-t border-border-hairline z-50 flex justify-center">
<div class="w-full max-w-2xl mx-auto flex justify-between items-center gap-md">
<span class="font-mono-data text-mono-data text-text-dusk hidden" id="counter">0/3 Selected</span>
<button class="w-full md:w-auto flex-grow rounded-full bg-surface-container-high text-text-dusk px-3xl py-lg font-display-m text-display-m transition-all duration-300 opacity-50 cursor-not-allowed" id="continue-btn">
                Continue
            </button>
</div>
</div>
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary-container/10 blur-[120px] rounded-full mix-blend-screen"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-secondary-container/10 blur-[120px] rounded-full mix-blend-screen"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.interest-chip');
            const continueBtn = document.getElementById('continue-btn');
            const counter = document.getElementById('counter');
            let selectedCount = 0;

            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const isSelected = chip.classList.contains('chip-selected');
                    
                    if (isSelected) {
                        chip.classList.remove('chip-selected');
                        chip.classList.add('chip-unselected');
                        selectedCount--;
                    } else {
                        chip.classList.add('chip-selected');
                        chip.classList.remove('chip-unselected');
                        selectedCount++;
                    }

                    updateContinueButton();
                });
            });

            function updateContinueButton() {
                counter.textContent = `${selectedCount}/3 Selected`;
                counter.classList.remove('hidden');

                if (selectedCount >= 3) {
                    continueBtn.classList.remove('bg-surface-container-high', 'text-text-dusk', 'opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-primary-container', 'text-text-moonlight', 'hover:bg-primary', 'hover:text-bg-void', 'active:scale-95');
                } else {
                    continueBtn.classList.add('bg-surface-container-high', 'text-text-dusk', 'opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.remove('bg-primary-container', 'text-text-moonlight', 'hover:bg-primary', 'hover:text-bg-void', 'active:scale-95');
                }
            }
        });
    </script>
